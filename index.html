<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>imoves</title>
<link rel="icon" href="https://platform.imoves.com/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="styles.css?v=0.23">
</head>
<body>
<div class="topbar">
  <div class="container">
    <a class="logo" href="#/"><img src="https://imovesnew.s3.eu-west-1.amazonaws.com/platformlogo/logo" alt="imoves"></a>
    <span class="slogan">Teacher view <span class="poc">PoC v0.23</span></span>
    <span class="userctx" id="userctx"></span>
    <nav>
      <a class="nbtn" href="#/" data-nav="home"><i class="bi-house-door-fill"></i> Home</a>
      <a class="nbtn" href="#/search" data-nav="search"><i class="bi-search"></i> Search</a>
      <a class="nbtn" href="#/browse" data-nav="browse"><i class="bi-list-ul"></i> Browse</a>
      <select id="classage" class="nbtn" aria-label="My class" title="Choose your class so age variants open on the right version">
        <option value="">My class: all ages</option>
        <option value="4">Reception (4-5)</option><option value="5">Year 1 (5-6)</option><option value="6">Year 2 (6-7)</option>
        <option value="7">Year 3 (7-8)</option><option value="8">Year 4 (8-9)</option><option value="9">Year 5 (9-10)</option><option value="10">Year 6 (10-11)</option>
      </select>
      <a class="nbtn upgrade hidden" id="upgradebtn" href="#/upgrade"><i class="bi-stars"></i> Upgrade</a>
      <span id="usernav"></span>
    </nav>
  </div>
</div>
<div class="subjectbar"><div class="container" id="subjectbar"></div></div>
<main><div class="container" id="app"><div class="loading">Loading…</div></div></main>
<div id="stickybanner" class="hidden"></div>
<footer>imoves web front end proof of concept. Content copied from Quickbase on <span id="stamp"></span>. Sign-in and entitlements run on real accounts.</footer>

<script src="config.js?v=0.23"></script>
<script src="auth.js?v=0.23"></script>
<script src="app.js?v=0.23"></script>
</body>
</html>
