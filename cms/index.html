<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>imoves content manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.6/Sortable.min.js"></script>
<style>
:root {
  --bg: #f5f4fa; --surface: #ffffff; --surface-2: #eeedf5; --ink: #1f1b2e; --ink-2: #5a5670; --ink-3: #8c88a0;
  --line: #dcd9e8; --line-2: #ebe9f3; --accent: #5b3fd1; --accent-ink: #ffffff; --accent-soft: #ece7fb;
  --live: #1e8e5a; --live-soft: #e3f4ea; --hidden: #8c88a0; --hidden-soft: #ededf1; --pending: #c47a12; --pending-soft: #fbefd9;
  --danger: #b42a3a; --danger-soft: #fbe5e8; --radius: 8px; --nav-w: 340px;
  font-family: 'Figtree', system-ui, sans-serif; font-size: 14px; line-height: 1.45; color: var(--ink);
  font-feature-settings: 'tnum' 1;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #16141f; --surface: #1f1c2b; --surface-2: #272336; --ink: #ecebf3; --ink-2: #b7b3c8; --ink-3: #847f9a;
  --line: #342f48; --line-2: #2a2639; --accent: #9c86f0; --accent-ink: #16141f; --accent-soft: #2d2747;
  --live: #4dc48a; --live-soft: #173426; --hidden: #847f9a; --hidden-soft: #2a2639; --pending: #e4a43c; --pending-soft: #3d2d14;
  --danger: #e8707d; --danger-soft: #3b1b21;
}}
:root[data-theme="dark"] {
  --bg: #16141f; --surface: #1f1c2b; --surface-2: #272336; --ink: #ecebf3; --ink-2: #b7b3c8; --ink-3: #847f9a;
  --line: #342f48; --line-2: #2a2639; --accent: #9c86f0; --accent-ink: #16141f; --accent-soft: #2d2747;
  --live: #4dc48a; --live-soft: #173426; --hidden: #847f9a; --hidden-soft: #2a2639; --pending: #e4a43c; --pending-soft: #3d2d14;
  --danger: #e8707d; --danger-soft: #3b1b21;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
body { display: grid; grid-template-rows: 52px 1fr; height: 100vh; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
h1, h2, h3, h4 { margin: 0; font-weight: 600; }
.muted { color: var(--ink-3); }
.small { font-size: 12.5px; }

/* header */
header { display: flex; align-items: center; gap: 16px; padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
header .brand { font-weight: 700; font-size: 16px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
header .brand span { color: var(--accent); }
header .search { flex: 1; max-width: 520px; position: relative; }
header .search input { width: 100%; padding: 8px 12px 8px 36px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); }
header .search svg { position: absolute; left: 12px; top: 9px; width: 18px; height: 18px; color: var(--ink-3); }
header .search .results { position: absolute; top: 40px; left: 0; right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 30px rgba(20,10,60,.15); max-height: 420px; overflow: auto; z-index: 30; display: none; }
header .search .results.open { display: block; }
header .search .results button { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; padding: 8px 12px; border: 0; background: none; cursor: pointer; }
header .search .results button:hover, header .search .results button:focus { background: var(--accent-soft); outline: none; }
header .search .results .kind { font-size: 11px; color: var(--ink-3); width: 56px; flex: none; }
header .spacer { flex: 1; }
header .who { font-size: 13px; color: var(--ink-2); }

.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.primary:disabled { opacity: .45; cursor: default; filter: none; }
.btn.danger { color: var(--danger); }
.btn.quiet { border-color: transparent; background: none; }
.btn.quiet:hover { background: var(--surface-2); }
.btn.sm { padding: 4px 9px; font-size: 12.5px; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.live { background: var(--live-soft); color: var(--live); }
.pill.hidden { background: var(--hidden-soft); color: var(--hidden); }
.pill.pending { background: var(--pending-soft); color: var(--pending); }
.pill.new { background: var(--accent-soft); color: var(--accent); }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

/* layout */
main { display: grid; grid-template-columns: var(--nav-w) 1fr; min-height: 0; }
nav { background: var(--surface); border-right: 1px solid var(--line); display: grid; grid-template-rows: auto 1fr; min-height: 0; }
nav .tree { overflow: auto; padding: 8px 8px 16px; border-bottom: 1px solid var(--line); max-height: 46%; }
nav .list { overflow: auto; padding: 8px; }
.tree details { margin: 0; }
.tree summary { list-style: none; cursor: pointer; padding: 6px 8px; border-radius: 6px; display: flex; align-items: center; gap: 6px; user-select: none; }
.tree summary::-webkit-details-marker { display: none; }
.tree summary:hover { background: var(--surface-2); }
.tree summary .chev { width: 14px; height: 14px; flex: none; transition: transform .15s; color: var(--ink-3); }
.tree details[open] > summary .chev { transform: rotate(90deg); }
.tree .subject > summary { font-weight: 600; }
.tree .group { margin-left: 14px; }
.tree .group > summary { font-weight: 500; }
.tree .cat { margin-left: 34px; }
.tree .cat button { width: 100%; text-align: left; border: 0; background: none; padding: 5px 8px; border-radius: 6px; cursor: pointer; display: flex; gap: 6px; align-items: center; }
.tree .cat button:hover { background: var(--surface-2); }
.tree .cat button.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.tree .count { margin-left: auto; color: var(--ink-3); font-size: 12px; font-weight: 400; }
.tree .off { color: var(--ink-3); }
.tree .off::after { content: ' (hidden)'; font-size: 11px; }

.listhead { display: flex; align-items: baseline; gap: 10px; padding: 8px 8px 6px; }
.listhead h2 { font-size: 14px; }
.listhead .btn { margin-left: auto; }
.rows { display: flex; flex-direction: column; gap: 3px; }
.row { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 4px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; background: var(--surface); }
.row:hover { background: var(--surface-2); }
.row.active { border-color: var(--accent); background: var(--accent-soft); }
.row.sortable-ghost { opacity: .35; }
.row.sortable-chosen { box-shadow: 0 6px 18px rgba(20,10,60,.18); }
.row .handle { width: 16px; height: 22px; flex: none; color: var(--ink-3); cursor: grab; display: grid; place-items: center; }
.row .handle svg { width: 12px; height: 12px; }
.row .thumb { width: 42px; height: 30px; flex: none; border-radius: 4px; object-fit: cover; background: var(--surface-2); }
.row .title { flex: 1; min-width: 0; }
.row .title .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .title .sub { font-size: 12px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .pill { flex: none; }
.row .num { width: 26px; flex: none; text-align: right; color: var(--ink-3); font-size: 12px; }
.empty { padding: 24px 12px; color: var(--ink-3); text-align: center; }

/* editor */
section.editor { overflow: auto; padding: 0 0 80px; }
.crumbs { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 24px 8px; display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); flex-wrap: wrap; }
.crumbs button { border: 0; background: none; padding: 2px 4px; cursor: pointer; color: var(--accent); font-weight: 500; }
.crumbs .sep { color: var(--ink-3); }
.crumbs .cur { font-weight: 600; color: var(--ink); }
.edhead { position: sticky; top: 38px; z-index: 5; background: var(--bg); padding: 4px 24px 12px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); }
.edhead h1 { font-size: 20px; letter-spacing: -0.01em; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.edhead .id { color: var(--ink-3); font-weight: 400; font-size: 14px; margin-left: 8px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin: 16px 24px 0; }
.panel > h3 { padding: 12px 16px 0; font-size: 14px; }
.panel .body { padding: 12px 16px 16px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px 20px; }
.grid .span { grid-column: 1 / -1; }
.field label { display: block; font-size: 12.5px; color: var(--ink-2); margin-bottom: 4px; }
.field input[type=text], .field input[type=number], .field select, .field textarea { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
.field textarea { min-height: 72px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.field.dirty label::after { content: ' • unsaved'; color: var(--pending); }
.check { display: inline-flex; align-items: center; gap: 6px; margin: 4px 14px 4px 0; cursor: pointer; }
.check input { width: 15px; height: 15px; accent-color: var(--accent); }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 500; }
.switch input { appearance: none; width: 36px; height: 20px; border-radius: 999px; background: var(--hidden); position: relative; transition: background .15s; margin: 0; }
.switch input::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s; }
.switch input:checked { background: var(--live); }
.switch input:checked::after { left: 18px; }
.switch input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.help { font-size: 12px; color: var(--ink-3); margin-top: 4px; }

/* child lists inside the editor */
.childlist .row { border: 1px solid var(--line-2); padding: 8px 10px 8px 4px; }
.childlist .row:hover { background: var(--surface-2); }
.childlist .row .pill { margin-left: 4px; }
.childlist .row .open { margin-left: auto; }
.part { border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface); }
.part .row { border: 0; cursor: default; }
.part .row .handle { cursor: grab; }
.part .media { width: 72px; flex: none; font-size: 12px; font-weight: 600; color: var(--ink-2); display: inline-flex; align-items: center; gap: 5px; }
.part .media svg { width: 15px; height: 15px; }
.part .detail { display: none; padding: 4px 14px 14px 42px; border-top: 1px solid var(--line-2); }
.part.open .detail { display: block; }
.part .thumb { width: 64px; height: 40px; }
.part.sortable-ghost { opacity: .35; }
.resource { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border: 1px dashed var(--line); border-radius: 6px; background: var(--bg); }
.resource img { width: 96px; height: 54px; object-fit: cover; border-radius: 4px; background: var(--surface-2); }
.resource .meta { flex: 1; min-width: 0; font-size: 12.5px; }
.resource .meta b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.resource .meta a { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }

/* changes drawer */
.drawer { position: fixed; top: 52px; right: 0; bottom: 0; width: 420px; max-width: 100%; background: var(--surface); border-left: 1px solid var(--line); box-shadow: -10px 0 30px rgba(20,10,60,.12); transform: translateX(100%); transition: transform .2s; z-index: 20; display: grid; grid-template-rows: auto 1fr; }
.drawer.open { transform: none; }
@media (prefers-reduced-motion: reduce) { .drawer, .tree .chev, .switch input, .switch input::after { transition: none; } }
.drawer .head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.drawer .head h2 { font-size: 15px; flex: 1; }
.drawer .items { overflow: auto; padding: 8px 16px 24px; }
.change { padding: 10px 0; border-bottom: 1px solid var(--line-2); font-size: 13px; }
.change .top { display: flex; gap: 8px; align-items: baseline; }
.change .top .when { color: var(--ink-3); font-size: 12px; margin-left: auto; white-space: nowrap; }
.change .what { color: var(--ink-2); margin-top: 2px; }
.change .diff { margin-top: 4px; font-size: 12.5px; }
.change .diff div { display: flex; gap: 6px; }
.change .diff .k { color: var(--ink-3); min-width: 110px; }
.change .diff .o { color: var(--danger); text-decoration: line-through; }
.change .diff .n { color: var(--live); }

/* modals */
.modal { position: fixed; inset: 0; background: rgba(20,10,60,.4); display: none; place-items: center; z-index: 40; padding: 16px; }
.modal.open { display: grid; }
.modal .box { background: var(--surface); border-radius: 12px; width: min(720px, 100%); max-height: 90vh; display: grid; grid-template-rows: auto auto 1fr auto; overflow: hidden; box-shadow: 0 20px 60px rgba(20,10,60,.3); }
.modal .box.narrow { width: min(420px, 100%); grid-template-rows: auto 1fr auto; }
.modal .mhead { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.modal .mhead h2 { font-size: 16px; flex: 1; }
.modal .mtools { padding: 10px 18px; display: flex; gap: 8px; border-bottom: 1px solid var(--line-2); }
.modal .mtools input, .modal .mtools select { padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
.modal .mtools input { flex: 1; }
.modal .mbody { overflow: auto; padding: 8px 18px; }
.modal .mfoot { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; }
.pick { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 8px; border: 0; background: none; border-radius: 8px; cursor: pointer; }
.pick:hover, .pick:focus { background: var(--accent-soft); outline: none; }
.pick img { width: 88px; height: 50px; object-fit: cover; border-radius: 4px; background: var(--surface-2); flex: none; }
.pick .meta { min-width: 0; flex: 1; }
.pick .meta b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick .meta span { font-size: 12px; color: var(--ink-3); }
.pick .ext { font-size: 12px; font-weight: 600; color: var(--ink-2); width: 48px; text-align: center; background: var(--surface-2); border-radius: 4px; padding: 10px 0; flex: none; }

/* toast */
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 13px; opacity: 0; transition: opacity .15s, transform .15s; z-index: 50; pointer-events: none; }
#toast.show { opacity: 1; transform: translateX(-50%); }
#toast.err { background: var(--danger); color: #fff; }

/* login */
#login .box { padding: 24px; display: block; }
#login h2 { font-size: 18px; margin-bottom: 4px; }
#login p { color: var(--ink-2); margin: 0 0 16px; }
#login .field { margin-bottom: 12px; }

@media (max-width: 900px) {
  main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  nav { border-right: 0; border-bottom: 1px solid var(--line); max-height: 45vh; }
  :root { --nav-w: 100%; }
  .edhead { top: 0; }
  .crumbs { position: static; }
}
</style>
</head>
<body>
<header>
  <div class="brand"><span>imoves</span> content manager</div>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Find a scheme, lesson or id" autocomplete="off" aria-label="Find a scheme or lesson">
    <div class="results" id="qres" role="listbox"></div>
  </div>
  <div class="spacer"></div>
  <button class="btn" id="changesBtn">Changes <span class="pill pending" id="pendingCount" hidden>0</span></button>
  <span class="who" id="who"></span>
  <button class="btn quiet sm" id="signout" hidden>Sign out</button>
</header>

<main>
  <nav>
    <div class="tree" id="tree"></div>
    <div class="list" id="list"><div class="empty">Choose a category to see its schemes.</div></div>
  </nav>
  <section class="editor" id="editor">
    <div class="empty" style="padding-top:120px">
      <h2 style="font-weight:600;font-size:18px;margin-bottom:8px">Nothing open yet</h2>
      Pick a category on the left, or search for a scheme or lesson above.
    </div>
  </section>
</main>

<aside class="drawer" id="drawer" aria-label="Recent changes">
  <div class="head"><h2>Recent changes</h2><span class="small muted" id="drawerNote"></span><button class="btn quiet sm" id="drawerClose">Close</button></div>
  <div class="items" id="changes"></div>
</aside>

<div class="modal" id="picker" role="dialog" aria-modal="true">
  <div class="box">
    <div class="mhead"><h2 id="pickerTitle">Choose a video</h2><button class="btn quiet sm" data-close>Close</button></div>
    <div class="mtools"><input id="pickerQ" type="search" placeholder="Search" autocomplete="off"><select id="pickerFilter"></select></div>
    <div class="mbody" id="pickerBody"></div>
    <div class="mfoot"><span class="small muted" id="pickerCount" style="margin-right:auto"></span></div>
  </div>
</div>

<div class="modal" id="confirm" role="dialog" aria-modal="true">
  <div class="box narrow">
    <div class="mhead"><h2 id="confirmTitle">Are you sure?</h2></div>
    <div class="mbody" id="confirmBody" style="padding:16px 18px"></div>
    <div class="mfoot"><button class="btn" data-close>Cancel</button><button class="btn primary" id="confirmOk">Continue</button></div>
  </div>
</div>

<div class="modal" id="login" role="dialog" aria-modal="true">
  <div class="box narrow">
    <h2>Sign in to edit</h2>
    <p>Browsing is open; changes need a staff login.</p>
    <div class="field"><label>Email</label><input type="text" id="loginEmail" autocomplete="username"></div>
    <div class="field"><label>Password</label><input type="password" id="loginPass" autocomplete="current-password" style="width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg)"></div>
    <div class="help" id="loginErr" style="color:var(--danger);min-height:18px"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px"><button class="btn" data-close>Not now</button><button class="btn primary" id="loginGo">Sign in</button></div>
  </div>
</div>

<div id="toast" role="status"></div>

<script>

};
{

  }
}

const CDN = 'https://d1i2jq09uv1ah.cloudfront.net/';
const CHOICES = {

  focus: ['Calming', 'Energising'], location: ['Classroom', 'Home', 'Hall', 'Outdoors', 'Corridors'],
  ages: ['4-5', '5-6', '6-7', '7-8', '8-9', '9-10', '10-11'], flags: ['Freemium', 'Featured', 'Supporting Resources', 'CPD'],

  group: ['Active Blasts', 'Science', 'PE', 'Gymnastics', 'Dance', 'Pilates', 'Maths', 'Mental Health', 'Standing in a Line', 'Lunchtime Games', 'Literacy & Phonics', 'Humanities', 'Teacher Resources', 'Active Adventures', 'Active Advent'],
  subheadings: ['Personal Learning Objective', 'Personal Learning Objectives', 'Primary Objective', 'Primary Objectives', 'Learning Outcomes', 'Skill Outcome', 'Equipment', 'Activities we will do:'],
};
const ICON = {
  Video: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 5h11a2 2 0 0 1 2 2v2.5l4-2.5v10l-4-2.5V17a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/></svg>',

// ------------------------------------------------------------------------------------------
// Data access: a thin PostgREST client. Reads use the anon key; writes carry the user token.
// ------------------------------------------------------------------------------------------
const session = { token: null, email: null };
function headers() {
  // Publishable keys (sb_publishable_...) go in the apikey header only; a signed-in user's
  // JWT (or the local dev token) goes in Authorization so PostgREST runs as "authenticated".
  const h = { 'Content-Type': 'application/json' };
  if (CONFIG.anonKey) h.apikey = CONFIG.anonKey;
  const t = session.token || CONFIG.devToken || (CONFIG.anonKey && !CONFIG.anonKey.startsWith('sb_') ? CONFIG.anonKey : '');
  if (t) h.Authorization = `Bearer ${t}`;
  return h;
}
async function api(method, path, body, prefer) {
  const h = headers();
  if (prefer) h.Prefer = prefer;
  const r = await fetch(`${CONFIG.url}${CONFIG.restPath}/${path}`, { method, headers: h, body: body === undefined ? undefined : JSON.stringify(body) });
  if (!r.ok) {
    let msg = `${r.status}`;
    try { const j = await r.json(); msg = j.message || j.hint || j.error_description || JSON.stringify(j); } catch (e) {}
    throw new Error(msg);
  }
  if (r.status === 204) return null;
  const text = await r.text();
  return text ? JSON.parse(text) : null;
}
const get = (path) => api('GET', path);
const insert = (table, row) => api('POST', table, row, 'return=representation').then(r => r[0]);
const update = (table, id, patch) => api('PATCH', `${table}?id=eq.${id}`, patch, 'return=representation').then(r => r[0]);
const remove = (table, id) => api('DELETE', `${table}?id=eq.${id}`);
const rpc = (fn, args) => api('POST', `rpc/${fn}`, args);

  wistia: null, s3: null, backgrounds: [],

const byId = (arr, id) => arr.find(x => x.id === id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const sortBy = (arr, key) => [...arr].sort((a, b) => ((a[key] ?? 1e12) - (b[key] ?? 1e12)) || (a.id - b.id));

let toastTimer;
function toast(msg, err) {

  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = '', err ? 5000 : 2200);

function confirmDialog(title, body, okLabel = 'Continue') {

}

// Auth (Supabase email + password; a dev token takes its place locally)
// ------------------------------------------------------------------------------------------
function decodeJwt(t) { try { return JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))); } catch (e) { return null; } }
function canWrite() { return !!(session.token || CONFIG.devToken); }
function renderWho() {
  const who = $('#who');
  if (session.token) { who.textContent = session.email; $('#signout').hidden = false; }
  else if (CONFIG.devToken) { const c = decodeJwt(CONFIG.devToken); who.textContent = (c && c.email ? c.email : 'local') + ' (dev)'; $('#signout').hidden = true; }
  else { who.innerHTML = '<button class="btn sm" id="signinBtn">Sign in to edit</button>'; $('#signout').hidden = true; $('#signinBtn').onclick = () => $('#login').classList.add('open'); }
}
async function restoreSession() {
  try {
    const raw = localStorage.getItem('cms.session'); if (!raw) return;
    const s = JSON.parse(raw); const c = decodeJwt(s.token);
    if (c && c.exp * 1000 > Date.now() + 60000) { session.token = s.token; session.email = s.email; }
    else if (s.refresh) await refreshSession(s.refresh);
  } catch (e) {}
}
async function refreshSession(refresh) {
  const r = await fetch(`${CONFIG.url}${CONFIG.authPath}/token?grant_type=refresh_token`, { method: 'POST', headers: { apikey: CONFIG.anonKey, 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: refresh }) });
  if (!r.ok) return;
  const j = await r.json(); session.token = j.access_token; session.email = j.user.email;
  localStorage.setItem('cms.session', JSON.stringify({ token: j.access_token, refresh: j.refresh_token, email: j.user.email }));
}
$('#loginGo').onclick = async () => {
  $('#loginErr').textContent = '';

    const r = await fetch(`${CONFIG.url}${CONFIG.authPath}/token?grant_type=password`, { method: 'POST', headers: { apikey: CONFIG.anonKey, 'Content-Type': 'application/json' }, body: JSON.stringify({ email: $('#loginEmail').value.trim(), password: $('#loginPass').value }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error_description || j.msg || j.message || 'Sign-in failed');
    session.token = j.access_token; session.email = j.user.email;
    localStorage.setItem('cms.session', JSON.stringify({ token: j.access_token, refresh: j.refresh_token, email: j.user.email }));
    $('#login').classList.remove('open'); renderWho(); toast(`Signed in as ${session.email}`);
  } catch (e) { $('#loginErr').textContent = e.message; }
};

$$('.modal [data-close]').forEach(b => b.onclick = () => b.closest('.modal').classList.remove('open'));
function requireWrite() { if (canWrite()) return true; $('#login').classList.add('open'); return false; }
function explainError(e) {
  const m = e.message || String(e);
  if (/JWT|jwt|permission denied|row-level security|401|403/.test(m)) return 'Your sign-in has expired. Sign in again and retry.';
  return m;
}

async function loadAll() {

function renderTree() {
  const t = $('#tree');
  const catCount = {};
  for (const l of S.schemeCats) catCount[l.subcategory_id] = (catCount[l.subcategory_id] || 0) + 1;
  const html = [];
  for (const sub of S.subjects) {
    const groups = S.groups.filter(g => g.subject_id === sub.id);
    const loose = S.cats.filter(c => c.subject_id === sub.id && !groups.some(g => g.id === c.subgroup_id));
    if (!groups.length && !loose.length) continue;
    const open = S.catId && S.cats.some(c => c.id === S.catId && c.subject_id === sub.id);
    html.push(`<details class="subject" ${open ? 'open' : ''}><summary>${ICON.chev}<span class="${sub.is_live ? '' : 'off'}">${esc(sub.name)}</span></summary>`);
    const catHtml = c => `<div class="cat"><button data-cat="${c.id}" class="${c.id === S.catId ? 'active' : ''}"><span class="${c.is_live ? '' : 'off'}">${esc(c.name)}</span><span class="count">${catCount[c.id] || ''}</span></button></div>`;
    for (const g of groups) {
      const cs = S.cats.filter(c => c.subgroup_id === g.id);
      const gopen = S.catId && cs.some(c => c.id === S.catId);
      html.push(`<details class="group" ${gopen ? 'open' : ''}><summary>${ICON.chev}<span class="${g.is_live ? '' : 'off'}">${esc(g.name)}</span><span class="count">${cs.length}</span></summary>${cs.map(catHtml).join('')}</details>`);
    }
    if (loose.length) html.push(`<details class="group" ${loose.some(c => c.id === S.catId) ? 'open' : ''}><summary>${ICON.chev}<span class="muted">No group</span><span class="count">${loose.length}</span></summary>${loose.map(catHtml).join('')}</details>`);
    html.push('</details>');
  }
  t.innerHTML = html.join('');
  $$('[data-cat]', t).forEach(b => b.onclick = () => openCategory(+b.dataset.cat));
}

// Editor plumbing: forms, dirty tracking, save
// ------------------------------------------------------------------------------------------
function field(label, name, value, opts = {}) {
  const v = value ?? '';
  let input;
  if (opts.type === 'textarea') input = `<textarea name="${name}" ${opts.rows ? `rows="${opts.rows}"` : ''}>${esc(v)}</textarea>`;
  else if (opts.type === 'select') input = `<select name="${name}"><option value="">${esc(opts.blank || '')}</option>${opts.choices.map(c => `<option ${String(v) === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>`;
  else if (opts.type === 'number') input = `<input type="number" name="${name}" value="${esc(v)}">`;
  else input = `<input type="text" name="${name}" value="${esc(v)}" ${opts.list ? `list="${opts.list}"` : ''}>`;
  return `<div class="field ${opts.span ? 'span' : ''}" data-field="${name}"><label>${label}</label>${input}${opts.help ? `<div class="help">${opts.help}</div>` : ''}</div>`;
}
function checks(label, name, values, choices) {
  return `<div class="field span" data-field="${name}"><label>${label}</label>${choices.map(c => `<label class="check"><input type="checkbox" name="${name}" value="${esc(c)}" ${values.includes(c) ? 'checked' : ''}>${esc(c)}</label>`).join('')}</div>`;
}
function readForm(root, orig) {
  const out = {};
  for (const el of $$('[name]', root)) {
    if (!(el.name in orig)) continue;
    if (el.type === 'checkbox') {
      const group = $$(`[name="${el.name}"]`, root);
      if (group.length > 1 || Array.isArray(orig[el.name])) out[el.name] = group.filter(x => x.checked).map(x => x.value);
      else out[el.name] = el.checked;
    } else if (el.type === 'number' || typeof orig[el.name] === 'number') out[el.name] = el.value === '' ? null : Number(el.value);
    else if (el.dataset.raw) out[el.name] = el.value;
    else out[el.name] = el.value === '' ? null : el.value;
  }
  return out;
}
function diff(orig, cur) {
  const d = {};
  for (const k of Object.keys(cur)) {
    const norm = v => typeof v === 'string' ? v.replace(/\r\n/g, '\n') : v;
    const a = norm(orig[k]), b = norm(cur[k]);
    const same = Array.isArray(b) ? JSON.stringify(a || []) === JSON.stringify(b) : (a ?? null) === (b ?? null) || (a === '' && b === null);
    if (!same) d[k] = b;
  }
  return d;
}
function wireForm(root, orig, onSave) {
  const mark = () => {
    const d = diff(orig, readForm(root, orig));
    $$('.field', root).forEach(f => f.classList.toggle('dirty', f.dataset.field in d));
    const n = Object.keys(d).length;
    const btn = $('#saveBtn'); if (btn) { btn.disabled = !n; btn.textContent = n ? `Save ${n} change${n === 1 ? '' : 's'}` : 'Saved'; }
    S.dirtyCount = n;
  };
  root.addEventListener('input', mark); root.addEventListener('change', mark);
  const btn = $('#saveBtn');
  if (btn) btn.onclick = async () => {
    if (!requireWrite()) return;
    const d = diff(orig, readForm(root, orig)); if (!Object.keys(d).length) return;
    btn.disabled = true; btn.textContent = 'Saving';
    try { await onSave(d); Object.assign(orig, d); mark(); toast('Saved'); refreshPending(); }
    catch (e) { toast(explainError(e), true); mark(); }
  };
  mark();
}
window.addEventListener('beforeunload', e => { if (S.dirtyCount) { e.preventDefault(); e.returnValue = ''; } });
async function guardDirty() {
  if (!S.dirtyCount) return true;
  const ok = await confirmDialog('Leave without saving?', 'You have unsaved changes on this record. Leaving discards them.', 'Discard changes');
  if (ok) S.dirtyCount = 0;
  return ok;
}
function crumbs(parts) {
  return `<div class="crumbs">${parts.map((p, i) => (i ? '<span class="sep">/</span>' : '') + (p.onclick ? `<button data-crumb="${i}">${esc(p.label)}</button>` : `<span class="cur">${esc(p.label)}</span>`)).join('')}</div>`;
}

  try {
    const maxOrder = Math.max(0, ...S.lessons.map(l => l.lesson_order || 0));
    const row = await insert('lessons', { name, internal_name: name, scheme_id: scheme.id, live_status: 'Hidden', lesson_order: maxOrder + 1, age_ranges: [], flags: [], location: [] });
    toast('Lesson created'); refreshPending(); openLesson(row.id);
  } catch (e) { toast(explainError(e), true); }
}
async function newPart(lesson, media) {
  if (!requireWrite()) return;
  try {
    const maxIndex = Math.max(0, ...S.parts.map(p => p.index || 0));
    const row = await insert('lesson_parts', { lesson_id: lesson.id, media_type: media, heading: media === 'Text only' ? 'Text' : `New ${media.toLowerCase()}`, index: maxIndex + 10, is_live: true, is_archived: false, s3_bucket: ['Audio', 'Download', 'Image'].includes(media) ? 'imovesnew' : null });
    toast(`${media} part added`); refreshPending();
    await openLesson(lesson.id);
    const card = $(`#partRows .part[data-id="${row.id}"]`); if (card) { togglePart(card, lesson); card.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
  } catch (e) { toast(explainError(e), true); }
}

// ------------------------------------------------------------------------------------------
// Pickers: Wistia videos and S3 files
// ------------------------------------------------------------------------------------------
async function ensureWistia() {
  if (S.wistia) return;
  S.wistia = await get('wistia_videos?select=id,hashed_id,name,project,duration,thumbnail_url,deleted_at&order=name.asc&limit=5000');
  S.wistiaById = Object.fromEntries(S.wistia.map(v => [v.hashed_id, v]));
}
async function ensureS3() {
  if (S.s3) return;
  const all = [];
  for (let from = 0; ; from += 5000) { const page = await get(`s3_files?select=id,name,path,filename,extension,size&order=name.asc&limit=5000&offset=${from}`); all.push(...page); if (page.length < 5000) break; }
  S.s3 = all;
}
function openPicker(title, filters, renderItems) {
  return new Promise(res => {
    const m = $('#picker'); $('#pickerTitle').textContent = title;
    const q = $('#pickerQ'), f = $('#pickerFilter'), body = $('#pickerBody');
    f.innerHTML = filters.map(x => `<option value="${esc(x.value)}">${esc(x.label)}</option>`).join('');
    const draw = () => { const items = renderItems(q.value.trim().toLowerCase(), f.value); body.innerHTML = items.html; $('#pickerCount').textContent = items.count; $$('[data-pickid]', body).forEach(b => b.onclick = () => done(items.lookup(b.dataset.pickid))); };
    const done = v => { m.classList.remove('open'); q.oninput = null; f.onchange = null; res(v); };
    q.value = ''; q.oninput = draw; f.onchange = draw; draw();
    m.classList.add('open'); q.focus();
    $$('[data-close]', m).forEach(b => b.onclick = () => done(null));
  });
}
async function pickWistia() {
  await ensureWistia();
  const projects = [...new Set(S.wistia.map(v => v.project).filter(Boolean))].sort();
  return openPicker('Choose a video', [{ value: '', label: 'All projects' }, ...projects.map(p => ({ value: p, label: p }))], (q, proj) => {
    const list = S.wistia.filter(v => !v.deleted_at && (!proj || v.project === proj) && (!q || (v.name || '').toLowerCase().includes(q) || (v.hashed_id || '').includes(q))).slice(0, 150);
    return { count: `${list.length} shown`, lookup: id => S.wistia.find(v => v.hashed_id === id),
      html: list.map(v => `<button class="pick" data-pickid="${esc(v.hashed_id)}"><img src="${esc(v.thumbnail_url || '')}" alt="" loading="lazy"><div class="meta"><b>${esc(v.name)}</b><span>${esc(v.project || '')} · ${fmtDur(v.duration)} · ${esc(v.hashed_id)}</span></div></button>`).join('') || '<div class="empty">No videos match.</div>' };
  });
}
async function pickS3(media) {
  await ensureS3();
  const exts = [...new Set(S.s3.map(f => f.extension).filter(Boolean))].sort();
  const def = media === 'Audio' ? '.mp3' : media === 'Download' ? '.pdf' : media === 'Image' ? '.jpg' : '';
  const p = openPicker('Choose a file', [{ value: '', label: 'All types' }, ...exts.map(e => ({ value: e, label: e }))], (q, ext) => {
    const list = S.s3.filter(f => (!ext || f.extension === ext) && (!q || (f.name || '').toLowerCase().includes(q))).slice(0, 200);
    return { count: `${list.length} shown of ${S.s3.length}`, lookup: id => S.s3.find(f => String(f.id) === id),
      html: list.map(f => `<button class="pick" data-pickid="${f.id}"><span class="ext">${esc((f.extension || '').replace('.', '').toUpperCase())}</span><div class="meta"><b>${esc(f.name)}</b><span>${f.size ? (f.size / 1024).toFixed(0) + ' KB' : ''}</span></div></button>`).join('') || '<div class="empty">No files match.</div>' };
  });
  if (def) { $('#pickerFilter').value = def; $('#pickerFilter').dispatchEvent(new Event('change')); }
  return p;
}

// ------------------------------------------------------------------------------------------
// Search
// ------------------------------------------------------------------------------------------
let qTimer;
$('#q').addEventListener('input', () => { clearTimeout(qTimer); qTimer = setTimeout(runSearch, 200); });
$('#q').addEventListener('keydown', e => { if (e.key === 'Escape') { $('#qres').classList.remove('open'); } });
document.addEventListener('click', e => { if (!e.target.closest('.search')) $('#qres').classList.remove('open'); });
async function runSearch() {
  const q = $('#q').value.trim(); const box = $('#qres');
  if (q.length < 2) { box.classList.remove('open'); return; }
  const num = /^\d+$/.test(q);
  const schemes = S.schemes.filter(s => num ? String(s.id) === q : ((s.name || '').toLowerCase().includes(q.toLowerCase()) || (s.internal_name || '').toLowerCase().includes(q.toLowerCase()))).slice(0, 8);
  let lessons = [];
  try { lessons = await get(num ? `lessons?id=eq.${q}&select=id,name,internal_name,scheme_id,is_live` : `lessons?or=(name.ilike.*${encodeURIComponent(q)}*,internal_name.ilike.*${encodeURIComponent(q)}*)&select=id,name,internal_name,scheme_id,is_live&limit=10`); } catch (e) {}
  box.innerHTML = [...schemes.map(s => `<button data-s="${s.id}"><span class="kind">Scheme</span><span>${esc(s.name)} <span class="muted small">${esc(s.internal_name || '')} · SID ${s.id}</span></span></button>`),
    ...lessons.map(l => { const s = byId(S.schemes, l.scheme_id); return `<button data-l="${l.id}"><span class="kind">Lesson</span><span>${esc(l.name)} <span class="muted small">${esc(s ? s.name : '')} · LID ${l.id}</span></span></button>`; })].join('') || '<div class="empty">Nothing found.</div>';
  box.classList.add('open');
  $$('[data-s]', box).forEach(b => b.onclick = () => { box.classList.remove('open'); jumpToScheme(+b.dataset.s); });
  $$('[data-l]', box).forEach(b => b.onclick = () => { box.classList.remove('open'); openLesson(+b.dataset.l); });
}
function jumpToScheme(id) {
  const link = S.schemeCats.find(l => l.scheme_id === id);
  if (link) { S.catId = link.subcategory_id; renderTree(); renderList(); }
  openScheme(id);
}

// ------------------------------------------------------------------------------------------
// Changes drawer (the log a Quickbase sync would read)
// ------------------------------------------------------------------------------------------
async function refreshPending() {
  try {
    const r = await fetch(`${CONFIG.url}${CONFIG.restPath}/content_changes?select=id&synced_at=is.null&limit=1`, { headers: { ...headers(), Prefer: 'count=exact' } });
    const n = +(r.headers.get('content-range') || '').split('/')[1] || 0;
    const el = $('#pendingCount'); el.textContent = n; el.hidden = !n;
  } catch (e) {}
}
$('#changesBtn').onclick = async () => {
  const dr = $('#drawer'); dr.classList.add('open');
  const items = $('#changes'); items.innerHTML = '<div class="empty">Loading…</div>';
  const rows = await get('content_changes?select=*&order=id.desc&limit=100');
  $('#drawerNote').textContent = rows.length ? `${rows.filter(r => !r.synced_at).length} waiting for the Quickbase sync` : '';
  const label = (t, id) => t === 'schemes' ? `Scheme SID ${id}` : t === 'lessons' ? `Lesson LID ${id}` : t === 'lesson_parts' ? `Part ${id}` : t === 'scheme_subcategories' ? `Scheme SID ${id} categories` : `${t} ${id}`;
  items.innerHTML = rows.map(r => `<div class="change"><div class="top"><b>${esc(label(r.table_name, r.record_id))}</b><span class="pill ${r.synced_at ? 'live' : 'pending'}">${r.synced_at ? 'Synced' : 'Pending'}</span><span class="when">${new Date(r.changed_at).toLocaleString('en-GB', { dateStyle: 'short', timeStyle: 'short' })}</span></div>
    <div class="what">${esc(r.action === 'insert' ? 'Created' : r.action === 'delete' ? 'Deleted' : 'Edited')} by ${esc(r.changed_by || 'unknown')}</div>
    ${r.action === 'update' ? `<div class="diff">${Object.entries(r.changes).map(([k, v]) => `<div><span class="k">${esc(k)}</span><span class="o">${esc(short(v.old))}</span><span class="n">${esc(short(v.new))}</span></div>`).join('')}</div>` : ''}</div>`).join('') || '<div class="empty">No changes yet.</div>';
};
function short(v) { if (v === null || v === undefined) return '—'; const s = typeof v === 'object' ? JSON.stringify(v) : String(v); return s.length > 60 ? s.slice(0, 57) + '…' : s; }
$('#drawerClose').onclick = () => $('#drawer').classList.remove('open');

// ------------------------------------------------------------------------------------------
// Start
// ------------------------------------------------------------------------------------------
(async () => {
  await restoreSession();
  renderWho();
  try { await loadAll(); } catch (e) { $('#tree').innerHTML = `<div class="empty">Could not load content: ${esc(e.message)}</div>`; }
  ensureWistia().catch(() => {});
})();
</script>
