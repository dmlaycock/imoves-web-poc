<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>imoves accounts</title>
<!-- accounts PoC page v0.2 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f4fa; --surface: #ffffff; --surface-2: #eeedf5; --ink: #1f1b2e; --ink-2: #5a5670; --ink-3: #8c88a0;
  --line: #dcd9e8; --line-2: #ebe9f3; --accent: #5b3fd1; --accent-ink: #ffffff; --accent-soft: #ece7fb;
  --live: #1e8e5a; --live-soft: #e3f4ea; --hidden: #8c88a0; --hidden-soft: #ededf1; --pending: #c47a12; --pending-soft: #fbefd9;
  --danger: #b42a3a; --danger-soft: #fbe5e8; --info: #1f6fb2; --info-soft: #e3eefa; --radius: 8px; --nav-w: 250px;
  font-family: 'Figtree', system-ui, sans-serif; font-size: 14px; line-height: 1.45; color: var(--ink);
  font-feature-settings: 'tnum' 1;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #16141f; --surface: #1f1c2b; --surface-2: #272336; --ink: #ecebf3; --ink-2: #b7b3c8; --ink-3: #847f9a;
  --line: #342f48; --line-2: #2a2639; --accent: #9c86f0; --accent-ink: #16141f; --accent-soft: #2d2747;
  --live: #4dc48a; --live-soft: #173426; --hidden: #847f9a; --hidden-soft: #2a2639; --pending: #e4a43c; --pending-soft: #3d2d14;
  --danger: #e8707d; --danger-soft: #3b1b21; --info: #6ea8e6; --info-soft: #1b2c40;
}}
:root[data-theme="dark"] {
  --bg: #16141f; --surface: #1f1c2b; --surface-2: #272336; --ink: #ecebf3; --ink-2: #b7b3c8; --ink-3: #847f9a;
  --line: #342f48; --line-2: #2a2639; --accent: #9c86f0; --accent-ink: #16141f; --accent-soft: #2d2747;
  --live: #4dc48a; --live-soft: #173426; --hidden: #847f9a; --hidden-soft: #2a2639; --pending: #e4a43c; --pending-soft: #3d2d14;
  --danger: #e8707d; --danger-soft: #3b1b21; --info: #6ea8e6; --info-soft: #1b2c40;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
body { display: grid; grid-template-rows: 52px 1fr; height: 100vh; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
h1, h2, h3, h4 { margin: 0; font-weight: 600; }
.muted { color: var(--ink-3); }
.small { font-size: 12.5px; }
.right { text-align: right; }
.nowrap { white-space: nowrap; }

header { display: flex; align-items: center; gap: 16px; padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
header .brand { font-weight: 700; font-size: 16px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
header .brand span { color: var(--accent); }
header .search { flex: 1; max-width: 560px; position: relative; }
header .search input { width: 100%; padding: 8px 12px 8px 36px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); }
header .search svg { position: absolute; left: 12px; top: 9px; width: 18px; height: 18px; color: var(--ink-3); }
header .search .results { position: absolute; top: 40px; left: 0; right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 30px rgba(20,10,60,.15); max-height: 460px; overflow: auto; z-index: 30; display: none; }
header .search .results.open { display: block; }
header .search .results button { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; padding: 8px 12px; border: 0; background: none; cursor: pointer; }
header .search .results button:hover, header .search .results button:focus { background: var(--accent-soft); outline: none; }
header .search .results .kind { font-size: 11px; color: var(--ink-3); width: 46px; flex: none; text-transform: uppercase; letter-spacing: .04em; }
header .search .results .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
header .search .results .t span { color: var(--ink-3); font-size: 12.5px; }
header .search .results .hd { padding: 8px 12px 2px; font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .04em; }
header .spacer { flex: 1; }
header .who { font-size: 13px; color: var(--ink-2); }

.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .45; cursor: default; filter: none; }
.btn.danger { color: var(--danger); }
.btn.quiet { border-color: transparent; background: none; }
.btn.quiet:hover { background: var(--surface-2); }
.btn.sm { padding: 4px 9px; font-size: 12.5px; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.live { background: var(--live-soft); color: var(--live); }
.pill.hidden { background: var(--hidden-soft); color: var(--hidden); }
.pill.pending { background: var(--pending-soft); color: var(--pending); }
.pill.new, .pill.accent { background: var(--accent-soft); color: var(--accent); }
.pill.danger { background: var(--danger-soft); color: var(--danger); }
.pill.info { background: var(--info-soft); color: var(--info); }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

main { display: grid; grid-template-columns: var(--nav-w) 1fr; min-height: 0; }
nav { background: var(--surface); border-right: 1px solid var(--line); min-height: 0; overflow: auto; padding: 10px 8px 24px; }
nav .sec { padding: 12px 8px 4px; font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; }
nav button.item { width: 100%; text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 6px; cursor: pointer; display: flex; gap: 8px; align-items: center; font-weight: 500; }
nav button.item:hover { background: var(--surface-2); }
nav button.item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
nav button.item .count { margin-left: auto; color: var(--ink-3); font-size: 12px; font-weight: 500; }
nav button.item.active .count { color: var(--accent); }
nav button.item svg { width: 16px; height: 16px; flex: none; color: var(--ink-3); }
nav button.item.active svg { color: var(--accent); }

section.page { overflow: auto; padding: 0 0 80px; }
.crumbs { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 24px 8px; display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); flex-wrap: wrap; }
.crumbs button { border: 0; background: none; padding: 2px 4px; cursor: pointer; color: var(--accent); font-weight: 500; }
.crumbs .sep { color: var(--ink-3); }
.crumbs .cur { font-weight: 600; color: var(--ink); }
.phead { position: sticky; top: 38px; z-index: 5; background: var(--bg); padding: 4px 24px 12px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.phead h1 { font-size: 20px; letter-spacing: -0.01em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.phead .id { color: var(--ink-3); font-weight: 400; font-size: 14px; margin-left: 8px; }
.phead .spacer { flex: 1; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin: 16px 24px 0; }
.panel > h3 { padding: 12px 16px 0; font-size: 14px; display: flex; align-items: center; gap: 10px; }
.panel > h3 .spacer { flex: 1; }
.panel .body { padding: 12px 16px 16px; }
.panel .body.tight { padding: 4px 0 8px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px 20px; }
.grid .span { grid-column: 1 / -1; }
.field label { display: block; font-size: 12.5px; color: var(--ink-2); margin-bottom: 4px; }
.field input[type=text], .field input[type=number], .field input[type=date], .field input[type=email], .field input[type=password], .field select, .field textarea { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
.field textarea { min-height: 72px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.field.dirty label::after { content: ' • unsaved'; color: var(--pending); }
.field .ro { padding: 7px 0; color: var(--ink); }
.check { display: inline-flex; align-items: center; gap: 6px; margin: 4px 14px 4px 0; cursor: pointer; }
.check input { width: 15px; height: 15px; accent-color: var(--accent); }
.help { font-size: 12px; color: var(--ink-3); margin-top: 4px; }

table.list { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.list th { text-align: left; font-size: 11.5px; color: var(--ink-3); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.list td { padding: 8px 10px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
table.list tr:last-child td { border-bottom: 0; }
table.list tr.click { cursor: pointer; }
table.list tr.click:hover td { background: var(--surface-2); }
table.list td .sub { font-size: 12px; color: var(--ink-3); }
table.list .acts { display: flex; gap: 4px; justify-content: flex-end; flex-wrap: wrap; }
table.list td.num, table.list th.num { text-align: right; }
.empty { padding: 24px 12px; color: var(--ink-3); text-align: center; }

.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin: 16px 24px 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; }
.card:hover { border-color: var(--accent); }
.card .n { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
.card .l { font-weight: 600; }
.card .d { font-size: 12.5px; color: var(--ink-3); }
.card.warn .n { color: var(--pending); }
.card.bad .n { color: var(--danger); }
.card.good .n { color: var(--live); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.stat .v { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
.stat .k { font-size: 12px; color: var(--ink-3); }

.listtools { display: flex; gap: 8px; align-items: center; padding: 12px 24px 0; flex-wrap: wrap; }
.listtools input[type=search], .listtools select { padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.listtools input[type=search] { min-width: 280px; }
.listtools .spacer { flex: 1; }

.note { padding: 10px 0; border-bottom: 1px solid var(--line-2); }
.note:last-child { border-bottom: 0; }
.note .top { display: flex; gap: 8px; align-items: baseline; font-size: 12.5px; color: var(--ink-3); flex-wrap: wrap; }
.note .top b { color: var(--ink); }
.note .body { margin-top: 3px; white-space: pre-wrap; }
.note .fu { margin-top: 5px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12.5px; }

.tabs { position: sticky; top: 0; z-index: 4; display: flex; gap: 2px; padding: 14px 24px 0; margin-top: 4px; background: var(--bg); border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 8px 14px 10px; cursor: pointer; font-weight: 500; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; gap: 7px; align-items: center; white-space: nowrap; border-radius: 6px 6px 0 0; }
.tabs button:hover { background: var(--surface-2); color: var(--ink); }
.tabs button.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.tabs button .n { font-size: 11.5px; font-weight: 600; background: var(--surface-2); color: var(--ink-2); border-radius: 999px; padding: 1px 7px; }
.tabs button.active .n { background: var(--accent-soft); color: var(--accent); }
.pane > .panel:first-child { margin-top: 16px; }

.drawer { position: fixed; top: 52px; right: 0; bottom: 0; width: 440px; max-width: 100%; background: var(--surface); border-left: 1px solid var(--line); box-shadow: -10px 0 30px rgba(20,10,60,.12); transform: translateX(100%); transition: transform .2s; z-index: 20; display: grid; grid-template-rows: auto 1fr; }
.drawer.open { transform: none; }
@media (prefers-reduced-motion: reduce) { .drawer { transition: none; } }
.drawer .head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.drawer .head h2 { font-size: 15px; flex: 1; }
.drawer .items { overflow: auto; padding: 8px 16px 24px; }
.change { padding: 10px 0; border-bottom: 1px solid var(--line-2); font-size: 13px; }
.change .top { display: flex; gap: 8px; align-items: baseline; }
.change .top .when { color: var(--ink-3); font-size: 12px; margin-left: auto; white-space: nowrap; }
.change .what { color: var(--ink-2); margin-top: 2px; }
.change .diff { margin-top: 4px; font-size: 12.5px; }
.change .diff div { display: flex; gap: 6px; }
.change .diff .k { color: var(--ink-3); min-width: 120px; }
.change .diff .o { color: var(--danger); text-decoration: line-through; }
.change .diff .n { color: var(--live); }

.modal { position: fixed; inset: 0; background: rgba(20,10,60,.4); display: none; place-items: center; z-index: 40; padding: 16px; }
.modal.open { display: grid; }
.modal .box { background: var(--surface); border-radius: 12px; width: min(680px, 100%); max-height: 92vh; display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; box-shadow: 0 20px 60px rgba(20,10,60,.3); }
.modal .box.narrow { width: min(440px, 100%); }
.modal .mhead { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.modal .mhead h2 { font-size: 16px; flex: 1; }
.modal .mbody { overflow: auto; padding: 14px 18px; }
.modal .mfoot { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
.modal .mfoot .err { color: var(--danger); font-size: 12.5px; margin-right: auto; }
.pick { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 8px; border: 0; background: none; border-radius: 8px; cursor: pointer; }
.pick:hover, .pick:focus { background: var(--accent-soft); outline: none; }
.pick .meta { min-width: 0; flex: 1; }
.pick .meta b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick .meta span { font-size: 12px; color: var(--ink-3); }

#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 13px; opacity: 0; transition: opacity .15s, transform .15s; z-index: 50; pointer-events: none; }
#toast.show { opacity: 1; transform: translateX(-50%); }
#toast.err { background: var(--danger); color: #fff; }

#login .box { padding: 24px; display: block; }
#login h2 { font-size: 18px; margin-bottom: 4px; }
#login p { color: var(--ink-2); margin: 0 0 16px; }
#login .field { margin-bottom: 12px; }

@media (max-width: 900px) {
  main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  nav { border-right: 0; border-bottom: 1px solid var(--line); max-height: 40vh; }
  :root { --nav-w: 100%; }
  .phead { top: 0; }
  .crumbs { position: static; }
}
</style>
</head>
<body>
<header>
  <div class="brand"><span>imoves</span> accounts</div>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Find a school, teacher, email, postcode or id" autocomplete="off" aria-label="Find a school or user">
    <div class="results" id="qres" role="listbox"></div>
  </div>
  <div class="spacer"></div>
  <button class="btn" id="changesBtn">Changes <span class="pill pending" id="pendingCount" hidden>0</span></button>
  <span class="who" id="who"></span>
  <button class="btn quiet sm" id="signout" hidden>Sign out</button>
</header>

<main>
  <nav id="nav"></nav>
  <section class="page" id="page"><div class="empty" style="padding-top:120px">Sign in to continue.</div></section>
</main>

<aside class="drawer" id="drawer" aria-label="Recent changes">
  <div class="head"><h2>Recent changes</h2><span class="small muted" id="drawerNote"></span><button class="btn quiet sm" id="drawerClose">Close</button></div>
  <div class="items" id="changes"></div>
</aside>

<div class="modal" id="form" role="dialog" aria-modal="true">
  <div class="box">
    <div class="mhead"><h2 id="formTitle"></h2><button class="btn quiet sm" data-close>Close</button></div>
    <div class="mbody" id="formBody"></div>
    <div class="mfoot"><span class="err" id="formErr"></span><button class="btn" data-close>Cancel</button><button class="btn primary" id="formOk">Save</button></div>
  </div>
</div>

<div class="modal" id="picker" role="dialog" aria-modal="true">
  <div class="box narrow">
    <div class="mhead"><h2 id="pickerTitle">Choose</h2><button class="btn quiet sm" data-close>Close</button></div>
    <div class="mbody" style="padding-top:10px"><input id="pickerQ" type="search" placeholder="Search" autocomplete="off" style="width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);margin-bottom:8px"><div id="pickerBody"></div></div>
    <div class="mfoot"><span class="small muted" id="pickerCount" style="margin-right:auto"></span></div>
  </div>
</div>

<div class="modal" id="login" role="dialog" aria-modal="true">
  <div class="box narrow">
    <h2>Sign in</h2>
    <p>School, teacher and subscription records are personal data, so nothing here is shown without a staff login.</p>
    <div class="field"><label>Email</label><input type="text" id="loginEmail" autocomplete="username"></div>
    <div class="field"><label>Password</label><input type="password" id="loginPass" autocomplete="current-password"></div>
    <div class="help" id="loginErr" style="color:var(--danger);min-height:18px"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px"><button class="btn primary" id="loginGo">Sign in</button></div>
  </div>
</div>

<div id="toast" role="status"></div>

<script>
// ------------------------------------------------------------------------------------------
// Configuration: the imoves-poc Supabase project. The publishable key alone cannot read any
// of the account tables (RLS allows signed-in staff only); a staff JWT is added on sign-in.
// ------------------------------------------------------------------------------------------
const CONFIG = { url: 'https://oscnzixjjganyzjppqqb.supabase.co', anonKey: 'sb_publishable_5XkVClKKeE1nbm1lRAqB5w_TAgaRNVE', restPath: '/rest/v1', authPath: '/auth/v1' };
{
  const p = new URLSearchParams(location.search);
  let dev = null; try { dev = p.get('api') || localStorage.getItem('acc.devApi'); } catch (e) {}
  if (dev) {
    CONFIG.url = dev; CONFIG.anonKey = ''; CONFIG.restPath = '';
    try { localStorage.setItem('acc.devApi', dev); CONFIG.devToken = p.get('token') || localStorage.getItem('acc.devToken') || ''; if (p.get('token')) localStorage.setItem('acc.devToken', p.get('token')); } catch (e) { CONFIG.devToken = p.get('token') || ''; }
  }
}
const VAT = 0.2;
const AGES = ['4-5', '5-6', '6-7', '7-8', '8-9', '9-10', '10-11'];
const ROLES = ['Head Teacher', 'Assistant Head Teacher', 'Deputy Head Teacher', 'PE Lead', 'Teacher', 'Teaching Assistant', 'KS1 Coordinator', 'KS2 Coordinator', 'Literacy Coordinator', 'Maths Coordinator', 'Office / Admin', 'Other'];
const PURPOSES = ['Sales Opportunity', 'Hot Lead', 'Account Setup', 'Low Usage', 'Nurture', 'Renewal Due', 'Potential Ambassador', 'Chase Renewal Details'];
const CANCEL_REASONS = ['Availability of budget', 'Value for money', 'Quality of resources', 'Variety or resources', 'Usability of the platform', 'Not being used', 'Using a competitor product', 'Something else'];
const ICONS = {
  today: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  school: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6"/></svg>',
  user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
  sub: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/></svg>',
  pkg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 3 7.5 12 12l9-4.5zM3 7.5V16l9 4.5 9-4.5V7.5M12 12v8.5"/></svg>',
  note: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h14v16H5zM8 9h8M8 13h6"/></svg>',
};

// ------------------------------------------------------------------------------------------
// Data access: PostgREST through the Supabase REST gateway. Every call carries the staff JWT.
// ------------------------------------------------------------------------------------------
const session = { token: null, email: null };
function headers() {
  const h = { 'Content-Type': 'application/json' };

function fieldHtml(f, v) {
  const val = v ?? f.value ?? '';
  const cls = 'field' + (f.span ? ' span' : '');
  if (f.type === 'checkbox') return `<label class="check" style="margin-top:22px"><input type="checkbox" name="${f.name}" ${val ? 'checked' : ''}> ${esc(f.label)}</label>`;
  if (f.type === 'select') return `<div class="${cls}"><label>${esc(f.label)}</label><select name="${f.name}">${(f.options || []).map(o => { const [ov, ol] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(ov)}" ${String(ov) === String(val) ? 'selected' : ''}>${esc(ol)}</option>`; }).join('')}</select>${f.help ? `<div class="help">${esc(f.help)}</div>` : ''}</div>`;
  if (f.type === 'textarea') return `<div class="${cls}"><label>${esc(f.label)}</label><textarea name="${f.name}">${esc(val)}</textarea>${f.help ? `<div class="help">${esc(f.help)}</div>` : ''}</div>`;
  if (f.type === 'checks') return `<div class="${cls}"><label>${esc(f.label)}</label>${f.options.map(o => `<label class="check"><input type="checkbox" name="${f.name}" value="${esc(o)}" ${(val || []).includes(o) ? 'checked' : ''}> ${esc(o)}</label>`).join('')}</div>`;
  if (f.type === 'static') return `<div class="${cls}"><label>${esc(f.label)}</label><div class="ro">${f.html || esc(val)}</div></div>`;
  return `<div class="${cls}"><label>${esc(f.label)}</label><input type="${f.type || 'text'}" name="${f.name}" value="${esc(val)}" ${f.step ? `step="${f.step}"` : ''} ${f.placeholder ? `placeholder="${esc(f.placeholder)}"` : ''} autocomplete="off">${f.help ? `<div class="help">${esc(f.help)}</div>` : ''}</div>`;
}
function readForm(root, fields) {
  const out = {};
  for (const f of fields) {
    if (f.type === 'static') continue;
    if (f.type === 'checkbox') { out[f.name] = $(`[name="${f.name}"]`, root).checked; continue; }
    if (f.type === 'checks') { out[f.name] = $$(`[name="${f.name}"]:checked`, root).map(x => x.value); continue; }
    const el = $(`[name="${f.name}"]`, root); let v = el.value;

}
// Opens the form modal. onSave(values, root) may throw to keep the modal open. onChange lets a field react.
function formDialog({ title, fields, values = {}, okLabel = 'Save', onSave, onChange, intro }) {

    $('#formTitle').textContent = title; $('#formOk').textContent = okLabel; err.textContent = '';
    body.innerHTML = (intro ? `<p class="small" style="margin:0 0 12px;color:var(--ink-2)">${intro}</p>` : '') + `<div class="grid">${fields.map(f => fieldHtml(f, values[f.name])).join('')}</div>`;
    m.classList.add('open');
    const first = $('input:not([type=checkbox]),select,textarea', body); if (first) setTimeout(() => first.focus(), 50);
    if (onChange) body.oninput = e => onChange(e.target.name, readForm(body, fields), body);

  return `<div class="tabs" data-kind="${kind}" role="tablist">${tabs.map(t => `<button role="tab" data-tab="${t.id}" class="${t.id === active ? 'active' : ''}" aria-selected="${t.id === active}">${esc(t.label)}${t.count !== undefined && t.count !== null && t.count !== '' ? `<span class="n">${t.count}</span>` : ''}</button>`).join('')}</div>`
    + tabs.map(t => `<div class="pane" data-pane="${t.id}" ${t.id === active ? '' : 'hidden'}>${t.html}</div>`).join('');
}
function wireTabs() {
  const bar = $('.tabs', $('#page')); if (!bar) return;
  $$('button', bar).forEach(b => b.onclick = () => {

    $$('.pane', $('#page')).forEach(p => p.hidden = p.dataset.pane !== b.dataset.tab);
    try { localStorage.setItem('acc.tab.' + bar.dataset.kind, b.dataset.tab); } catch (e) {}
    const [path] = location.hash.split('?'); history.replaceState(null, '', `${path}?tab=${b.dataset.tab}`);
    if (S.route && S.route.params) S.route.params.set('tab', b.dataset.tab);
  });
}

const ro = (label, v) => `<div class="field"><label>${esc(label)}</label><div class="ro">${esc(v || '') || '<span class="muted">–</span>'}</div></div>`;
function memberActions(u, schoolId) {

  if (u.membership_state === 'approved' && !u.is_admin) a.push(`<button class="btn sm" data-admin="${u.id}" data-school="${schoolId}">Make admin</button>`);
  if (u.is_admin) a.push(`<button class="btn sm" data-unadmin="${u.id}" data-school="${schoolId}">Remove admin</button>`);
  if (u.membership_state === 'approved') a.push(`<button class="btn sm danger" data-remove="${u.id}" data-school="${schoolId}">Remove</button>`);
  if (u.membership_state === 'removed' || u.membership_state === 'declined') a.push(`<button class="btn sm" data-approve="${u.id}" data-school="${schoolId}">Reactivate</button>`);
  return a.join('');

// One membership row per user and school; actions set the flags on the latest row (or
// create one). The database derives state and is_admin, then the user's entitlement.
async function setMembership(userId, schoolId, action) {
  if (!schoolId) throw new Error('The teacher has not chosen a school yet');
  const latest = (await get(`memberships?select=*&user_id=eq.${userId}&school_id=eq.${schoolId}&order=id.desc&limit=1`))[0];
  if (action === 'request') { if (!latest) await insert('memberships', { user_id: userId, school_id: schoolId, requested: true }); else await rpc('recompute_user', { p_user_id: userId }); return; }
  const patch = { changed_by_staff: true };
  if (action === 'approve') Object.assign(patch, { approved: true, declined: false, removed: false, invite_declined: false });
  if (action === 'decline') Object.assign(patch, { declined: true, approved: false });
  if (action === 'remove') Object.assign(patch, { removed: true });
  if (action === 'admin') Object.assign(patch, { approved: true, removed: false, declined: false, admin_granted: true, admin_removed: false });
  if (action === 'unadmin') Object.assign(patch, { admin_removed: true });
  if (latest) await update('memberships', latest.id, patch);

function changeHtml(c) {
  const diff = c.action === 'update' ? Object.entries(c.changes).map(([k, v]) => `<div><span class="k">${esc(k)}</span><span class="o">${esc(fmtVal(v.old))}</span><span class="n">${esc(fmtVal(v.new))}</span></div>`).join('')
    : c.action === 'insert' ? `<div><span class="k">created</span><span class="n">${esc(Object.entries(c.changes).filter(([k, v]) => v !== null && v !== false && !/^(id|qb_|created_at|updated_at|status|state|is_admin|entitlement|membership_state)/.test(k) && !(Array.isArray(v) && !v.length) && !(typeof v === 'object' && !Array.isArray(v) && !Object.keys(v).length)).map(([k, v]) => `${k}: ${fmtVal(v)}`).join(' · ').slice(0, 300))}</span></div>` : '<div><span class="k">deleted</span></div>';
  return `<div class="change"><div class="top"><b>${esc(c.table_name)} #${c.record_id}</b><span class="muted">${esc(c.action)}</span>${c.synced_at ? pill('live', 'synced') : pill('pending', 'to sync')}<span class="when">${fmtDT(c.changed_at)}</span></div><div class="what">${esc(c.changed_by || '')}</div><div class="diff">${diff}</div></div>`;
}
const fmtVal = v => v === null || v === undefined ? '' : typeof v === 'object' ? JSON.stringify(v) : String(v);
async function loadPending() {
  try {
    const n = await count('account_changes?select=id&synced_at=is.null');
    $('#pendingCount').textContent = n || 0; $('#pendingCount').hidden = !n;
  } catch (e) {}
}
$('#changesBtn').onclick = async () => {
  $('#drawer').classList.add('open');
  try {
    const rows = await get('account_changes?select=*&order=id.desc&limit=100');
    $('#changes').innerHTML = rows.length ? rows.map(changeHtml).join('') : '<div class="empty">No changes recorded yet</div>';
    $('#drawerNote').textContent = rows.length ? `${rows.filter(r => !r.synced_at).length} waiting for a Quickbase sync` : '';
  } catch (e) { $('#changes').innerHTML = `<div class="empty">${esc(explainError(e))}</div>`; }
};
$('#drawerClose').onclick = () => $('#drawer').classList.remove('open');
document.addEventListener('visibilitychange', () => { if (!document.hidden) loadPending(); });

// ------------------------------------------------------------------------------------------
(async () => { await restoreSession(); renderWho(); start(); })();
</script>
</body>
</html>
