<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>imoves content</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Baloo+2:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.6/Sortable.min.js"></script>
<style>
:root {
  --bg: #f5f4fa; --surface: #ffffff; --surface-2: #eeedf5; --ink: #1f1b2e; --ink-2: #5a5670; --ink-3: #8c88a0;
  --line: #dcd9e8; --line-2: #ebe9f3; --accent: #5b3fd1; --accent-ink: #ffffff; --accent-soft: #ece7fb;
  --live: #1e8e5a; --live-soft: #e3f4ea; --hidden: #8c88a0; --hidden-soft: #ededf1; --pending: #c47a12; --pending-soft: #fbefd9;
  --danger: #b42a3a; --danger-soft: #fbe5e8; --radius: 8px; --nav-w: 320px;
  font-family: 'Figtree', system-ui, sans-serif; font-size: 14px; line-height: 1.45; color: var(--ink);
  font-feature-settings: 'tnum' 1;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #16141f; --surface: #1f1c2b; --surface-2: #272336; --ink: #ecebf3; --ink-2: #b7b3c8; --ink-3: #847f9a;
  --line: #342f48; --line-2: #2a2639; --accent: #9c86f0; --accent-ink: #16141f; --accent-soft: #2d2747;
  --live: #4dc48a; --live-soft: #173426; --hidden: #847f9a; --hidden-soft: #2a2639; --pending: #e4a43c; --pending-soft: #3d2d14;
  --danger: #e8707d; --danger-soft: #3b1b21;
}}
:root[data-theme="dark"] {
  --bg: #16141f; --surface: #1f1c2b; --surface-2: #272336; --ink: #ecebf3; --ink-2: #b7b3c8; --ink-3: #847f9a;
  --line: #342f48; --line-2: #2a2639; --accent: #9c86f0; --accent-ink: #16141f; --accent-soft: #2d2747;
  --live: #4dc48a; --live-soft: #173426; --hidden: #847f9a; --hidden-soft: #2a2639; --pending: #e4a43c; --pending-soft: #3d2d14;
  --danger: #e8707d; --danger-soft: #3b1b21;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
body { display: grid; grid-template-rows: 52px auto 1fr; height: 100vh; overflow: hidden; }
body.signedout main { display: none; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
h1, h2, h3, h4 { margin: 0; font-weight: 600; }
.muted { color: var(--ink-3); }
.small { font-size: 12.5px; }
svg.i { width: 16px; height: 16px; flex: none; }

header { display: flex; align-items: center; gap: 14px; padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
header .brand { font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
header .brand span.b { color: var(--accent); }
header .search { flex: 1; max-width: 520px; position: relative; }
header .search input { width: 100%; padding: 8px 12px 8px 36px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); }
header .search svg { position: absolute; left: 12px; top: 9px; width: 18px; height: 18px; color: var(--ink-3); }
header .search .results { position: absolute; top: 40px; left: 0; right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 30px rgba(20,10,60,.15); max-height: 420px; overflow: auto; z-index: 30; display: none; }
header .search .results.open { display: block; }
header .search .results button { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; padding: 8px 12px; border: 0; background: none; cursor: pointer; }
header .search .results button:hover, header .search .results button:focus { background: var(--accent-soft); outline: none; }
header .spacer { flex: 1; }
header .who { font-size: 13px; color: var(--ink-2); white-space: nowrap; }

.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .45; cursor: default; filter: none; }
.btn.danger { color: var(--danger); }
.btn.quiet { border-color: transparent; background: none; }
.btn.quiet:hover { background: var(--surface-2); }
.btn.sm { padding: 4px 9px; font-size: 12.5px; }
.btn.icon { padding: 5px; border-color: transparent; background: none; color: var(--ink-3); }
.btn.icon:hover { background: var(--surface-2); color: var(--ink); }
.btn.icon.danger:hover { background: var(--danger-soft); color: var(--danger); }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.live { background: var(--live-soft); color: var(--live); }
.pill.hidden { background: var(--hidden-soft); color: var(--hidden); }
.pill.pending { background: var(--pending-soft); color: var(--pending); }
.pill.new { background: var(--accent-soft); color: var(--accent); }
.kind { font-size: 10.5px; font-weight: 700; color: var(--ink-3); background: var(--surface-2); border-radius: 4px; padding: 2px 6px; text-transform: uppercase; letter-spacing: .04em; flex: none; }
.kind.scheme { color: var(--accent); background: var(--accent-soft); }
.kind.lesson { color: var(--live); background: var(--live-soft); }
.kind.media_block { color: var(--pending); background: var(--pending-soft); }

/* published switch: green = teachers can see it; amber dot = edits they cannot see yet */
.sw { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 500; position: relative; }
.sw input { appearance: none; width: 36px; height: 20px; border-radius: 999px; background: var(--hidden); position: relative; transition: background .15s; margin: 0; cursor: pointer; flex: none; }
.sw input::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s; }
.sw input:checked { background: var(--live); }
.sw input:checked::after { left: 18px; }
.sw input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sw input:disabled { opacity: .5; cursor: default; }
.sw.waiting::before { content: ''; position: absolute; top: -4px; left: 28px; width: 10px; height: 10px; border-radius: 50%; background: var(--pending); border: 2px solid var(--surface); z-index: 1; }
.sw.row-sw { gap: 0; }

main { display: grid; grid-template-columns: var(--nav-w) 1fr; min-height: 0; }
nav { background: var(--surface); border-right: 1px solid var(--line); min-height: 0; overflow: auto; display: flex; flex-direction: column; }
nav .navtools { display: flex; gap: 6px; padding: 10px 10px 4px; align-items: center; flex-wrap: wrap; }
nav .navtools select { padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); font-size: 12.5px; }
nav .tree { padding: 4px 8px 24px; }
.tree details { margin: 0; }
.tree summary { list-style: none; cursor: pointer; padding: 6px 8px; border-radius: 6px; display: flex; align-items: center; gap: 6px; user-select: none; }
.tree summary::-webkit-details-marker { display: none; }
.tree summary:hover { background: var(--surface-2); }
.tree summary .chev { width: 14px; height: 14px; flex: none; transition: transform .15s; color: var(--ink-3); }
.tree details[open] > summary .chev { transform: rotate(90deg); }
.tree summary a { color: inherit; text-decoration: none; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tree summary a.active, .tree .cat button.active { color: var(--accent); font-weight: 700; }
.tree .subject > summary { font-weight: 600; }
.tree .group { margin-left: 14px; }
.tree .group > summary { font-weight: 500; }
.tree .cat { margin-left: 34px; }
.tree .cat button { width: 100%; text-align: left; border: 0; background: none; padding: 5px 8px; border-radius: 6px; cursor: pointer; display: flex; gap: 6px; align-items: center; }
.tree .cat button:hover { background: var(--surface-2); }
.tree .cat button span.n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tree .hint { padding: 10px 8px 4px; font-size: 12px; color: var(--ink-3); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.tree .count { margin-left: auto; color: var(--ink-3); font-size: 12px; font-weight: 400; }
.tree .off { color: var(--ink-3); }
.tree .off::after { content: ' · hidden'; font-size: 11px; }
.tree .archl { display: block; padding: 10px 8px; font-size: 12.5px; }

section.editor { overflow: auto; padding: 0 0 80px; }
.crumbs { padding: 14px 24px 0; display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); flex-wrap: wrap; }
.crumbs button { border: 0; background: none; padding: 2px 4px; cursor: pointer; color: var(--accent); font-weight: 500; }
.crumbs .sep { color: var(--ink-3); }
.edhead { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 8px 24px 10px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid var(--line); }
.edhead h1 { font-size: 20px; letter-spacing: -0.01em; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.edhead h1 .id { color: var(--ink-3); font-weight: 400; font-size: 13px; margin-left: 8px; }
.edhead .meta { font-size: 12.5px; color: var(--ink-3); white-space: nowrap; }
.edhead .meta button { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; font-weight: 500; }
.edhead .actions { display: flex; gap: 10px; align-items: center; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin: 16px 24px 0; }
.panel > h3 { padding: 14px 16px 0; font-size: 14px; display: flex; align-items: center; gap: 10px; }
.panel > h3 .muted { font-weight: 400; }
.panel > h3 .tools { margin-left: auto; display: flex; gap: 6px; align-items: center; font-weight: 400; }
.panel > h3 .tools select { padding: 3px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); font-size: 12.5px; }
.panel .body { padding: 12px 16px 16px; }
.subpanel > h3 { padding: 0 0 8px; font-size: 13px; display: flex; align-items: center; }
.subpanel > .body { padding: 0; }
.panel.collapsible > h3 { cursor: pointer; }
.panel.collapsed .body { display: none; }

.rows { display: flex; flex-direction: column; gap: 4px; }
.row { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 4px; border-radius: 8px; cursor: pointer; border: 1px solid var(--line-2); background: var(--surface); }
.row:hover { background: var(--surface-2); }
.row.off .title { color: var(--ink-3); }
.row.sortable-ghost { opacity: .35; }
.row.sortable-chosen { box-shadow: 0 6px 18px rgba(20,10,60,.18); }
.row .handle { width: 18px; height: 24px; flex: none; color: var(--ink-3); cursor: grab; display: grid; place-items: center; }
.row .handle svg { width: 12px; height: 12px; }
.row .thumb { width: 44px; height: 30px; flex: none; border-radius: 4px; object-fit: cover; background: var(--surface-2); }
.row .title { flex: 1; min-width: 0; }
.row .title .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .title .sub { font-size: 12px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .num { width: 54px; flex: none; text-align: right; color: var(--ink-3); font-size: 12px; white-space: nowrap; }
.row .ages { font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }
.row .rt { display: flex; gap: 4px; align-items: center; flex: none; }
.empty { padding: 24px 12px; color: var(--ink-3); text-align: center; }
.inline-add { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
.menu { position: relative; }
.menu .items { position: absolute; top: 36px; left: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 30px rgba(20,10,60,.15); display: none; z-index: 30; min-width: 230px; padding: 4px; }
.menu.up .items { top: auto; bottom: 36px; }
.menu.open .items { display: block; }
.menu .items button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
.menu .items button:hover { background: var(--accent-soft); }
.menu .items hr { border: 0; border-top: 1px solid var(--line-2); margin: 4px 0; }

.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px 20px; }
.grid .span { grid-column: 1 / -1; }
.field label { display: block; font-size: 12.5px; color: var(--ink-2); margin-bottom: 4px; }
.field input[type=text], .field input[type=number], .field input[type=email], .field input[type=password], .field input[type=url], .field select, .field textarea { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
.field textarea { min-height: 64px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus, .rte:focus-within { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.field.dirty label::after { content: ' • unsaved'; color: var(--pending); }
.help { font-size: 12px; color: var(--ink-3); margin-top: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
label.chip, button.chip { display: inline-flex; align-items: center; margin: 0; padding: 5px 11px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); cursor: pointer; font-size: 13px; color: var(--ink-2); user-select: none; }
label.chip:hover, button.chip:hover { border-color: var(--ink-3); }
label.chip input { position: absolute; opacity: 0; width: 0; height: 0; }
label.chip:has(input:checked), button.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
label.chip:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.sw.field-sw { font-size: 13.5px; }
.subhead { font-size: 12.5px; font-weight: 600; color: var(--ink-3); margin: 6px 0 8px; }
.agepick .quick { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.agepick .years { display: flex; gap: 4px; flex-wrap: wrap; }
.agepick .years label { display: inline-flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); cursor: pointer; font-size: 12px; min-width: 48px; }
.agepick .years label small { color: var(--ink-3); font-size: 10.5px; }
.agepick .years label:has(input:checked) { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.agepick .years input { position: absolute; opacity: 0; width: 0; height: 0; }
.colour { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.colour button { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
.colour button.on { border-color: var(--ink); box-shadow: 0 0 0 2px var(--surface); }
.colour input[type=color] { width: 28px; height: 28px; border: 0; padding: 0; background: none; cursor: pointer; }
.iconpick { display: flex; gap: 4px; flex-wrap: wrap; }
.iconpick button { width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); cursor: pointer; font-size: 16px; }
.iconpick button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.imgfield { display: flex; gap: 12px; align-items: flex-start; }
.imgfield .pv { width: 160px; aspect-ratio: 16/9; border-radius: 8px; object-fit: cover; background: var(--surface-2); border: 1px solid var(--line); flex: none; }
.imgfield .tile { width: 160px; aspect-ratio: 16/9; border-radius: 8px; background: linear-gradient(135deg, #733088, #9c4dbf); color: #fff; display: grid; place-items: center; text-align: center; padding: 8px; font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 15px; line-height: 1.15; flex: none; }
.imgfield .f { flex: 1; }

/* rich text */
.textwork { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 0.8fr); gap: 20px; align-items: start; }
.rte { border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.rte .bar { display: flex; gap: 2px; padding: 6px; border-bottom: 1px solid var(--line-2); flex-wrap: wrap; }
.rte .bar button { border: 0; background: none; padding: 4px 8px; border-radius: 5px; cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.rte .bar button:hover { background: var(--surface-2); }
.rte .bar button.on { background: var(--accent-soft); color: var(--accent); }
.rte .bar .sep { width: 1px; background: var(--line-2); margin: 2px 4px; }
.rte .ed { min-height: 180px; padding: 12px 14px; outline: none; font-size: 14.5px; line-height: 1.5; }
.rte .ed:empty::before { content: attr(data-placeholder); color: var(--ink-3); }
.rte .ed h5 { font-size: 15px; font-weight: 700; margin: 12px 0 4px; }
.rte .ed p { margin: 0 0 8px; }
.rte .ed ul { margin: 0 0 8px; padding-left: 22px; }
.preview { position: sticky; top: 70px; border: 1px solid var(--line); border-radius: 10px; background: #fff; padding: 18px 20px; font-family: 'Baloo 2', 'BalooPrimary', sans-serif; color: #733088; line-height: 1.35; }
.preview .pvlabel { font-family: 'Figtree', system-ui, sans-serif; font-size: 11.5px; color: var(--ink-3); margin-bottom: 10px; display: flex; justify-content: space-between; }
.preview .pvtitle { font-weight: 700; font-size: 22px; color: #733088; margin: 0 0 2px; }
.preview .pvsub { font-weight: 400; font-size: 15px; color: #9565a6; margin: 0 0 12px; }
.preview p { margin: 0 0 10px; font-weight: 400; font-size: 15px; color: #733088; }
.preview h5 { margin: 10px 0 2px; font-size: 17px; font-weight: 700; color: #733088; }
.preview h5 + p { color: #9565a6; }
.preview ul { color: #733088; font-size: 15px; }
.preview .pvempty { color: #b898c5; font-style: italic; }
.preview img.pvimg { width: 120px; float: left; margin: 0 14px 8px 0; border-radius: 6px; }

/* parts */
.part { border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface); }
.part .row { border: 0; }
.part .media { width: 90px; flex: none; font-size: 12px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.part .detail { display: none; padding: 4px 14px 14px 42px; border-top: 1px solid var(--line-2); }
.part.open .detail { display: block; }
.part.open > .row { background: var(--surface-2); border-radius: 8px 8px 0 0; }
.part.sortable-ghost { opacity: .35; }
.blockhead { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; color: var(--ink-3); margin: 14px 0 6px; text-transform: uppercase; letter-spacing: .04em; }
.blockhead:first-child { margin-top: 0; }
.vtabs { display: flex; gap: 6px; padding: 0 0 10px; flex-wrap: wrap; align-items: center; }
.vtabs button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-weight: 500; }
.vtabs button.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.place { display: flex; flex-direction: column; gap: 8px; }
.place .item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface); cursor: pointer; }
.place .item:hover { background: var(--surface-2); }
.place .item .path { flex: 1; min-width: 0; }
.place .item .path b { display: block; }
.place .item .path span { font-size: 12px; color: var(--ink-3); }
.place .item.home { border-color: var(--accent); }

/* drawers, modals, toast */
.drawer { position: fixed; top: 52px; right: 0; bottom: 0; width: 460px; max-width: 100%; background: var(--surface); border-left: 1px solid var(--line); box-shadow: -10px 0 30px rgba(20,10,60,.12); transform: translateX(100%); transition: transform .2s; z-index: 20; display: grid; grid-template-rows: auto 1fr; }
.drawer.open { transform: none; }
@media (prefers-reduced-motion: reduce) { .drawer, .tree .chev, .sw input, .sw input::after { transition: none; } }
.drawer .head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.drawer .head h2 { font-size: 15px; flex: 1; }
.drawer .items { overflow: auto; padding: 8px 16px 24px; }
.change { padding: 10px 0; border-bottom: 1px solid var(--line-2); font-size: 13px; }
.change .top { display: flex; gap: 8px; align-items: baseline; }
.change .top .when { color: var(--ink-3); font-size: 12px; margin-left: auto; white-space: nowrap; }
.change .what { color: var(--ink-2); margin-top: 2px; }
.change .diff { margin-top: 4px; font-size: 12.5px; }
.change .diff div { display: flex; gap: 6px; }
.change .diff .k { color: var(--ink-3); min-width: 110px; }
.change .diff .o { color: var(--danger); text-decoration: line-through; }
.change .diff .n { color: var(--live); }
.history .v { display: flex; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line-2); font-size: 13px; }
.history .v .n { font-weight: 600; width: 40px; }
.history .v .who { flex: 1; color: var(--ink-2); }
.history .v .when { color: var(--ink-3); font-size: 12px; }
.modal { position: fixed; inset: 0; background: rgba(20,10,60,.4); display: none; place-items: center; z-index: 40; padding: 16px; }
.modal.open { display: grid; }
.modal .box { background: var(--surface); border-radius: 12px; width: min(720px, 100%); max-height: 90vh; display: grid; grid-template-rows: auto auto 1fr auto; overflow: hidden; box-shadow: 0 20px 60px rgba(20,10,60,.3); }
.modal .box.narrow { width: min(440px, 100%); grid-template-rows: auto 1fr auto; }
.modal .mhead { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.modal .mhead h2 { font-size: 16px; flex: 1; }
.modal .mtools { padding: 10px 18px; display: flex; gap: 8px; border-bottom: 1px solid var(--line-2); }
.modal .mtools input, .modal .mtools select { padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
.modal .mtools input { flex: 1; }
.modal .mbody { overflow: auto; padding: 8px 18px; }
.modal .mfoot { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; }
.pick { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 8px; border: 0; background: none; border-radius: 8px; cursor: pointer; }
.pick:hover, .pick:focus { background: var(--accent-soft); outline: none; }
.pick:disabled { opacity: .5; cursor: default; }
.pick .meta { min-width: 0; flex: 1; }
.pick .meta b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick .meta span { font-size: 12px; color: var(--ink-3); }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 13px; opacity: 0; transition: opacity .15s, transform .15s; z-index: 50; pointer-events: none; }
#toast.show { opacity: 1; transform: translateX(-50%); }
#toast.err { background: var(--danger); color: #fff; }
#login .box { padding: 24px; display: block; }
#login h2 { font-size: 18px; margin-bottom: 4px; }
#login p { color: var(--ink-2); margin: 0 0 16px; }
#login .field { margin-bottom: 12px; }
.readonly { background: var(--pending-soft); color: var(--pending); padding: 6px 24px; font-size: 13px; }
.subjects-page .row .title .name { font-size: 15px; }
@media (max-width: 1100px) { .textwork { grid-template-columns: 1fr; } .preview { position: static; } }
@media (max-width: 900px) {
  main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  nav { border-right: 0; border-bottom: 1px solid var(--line); max-height: 45vh; }
  :root { --nav-w: 100%; }
}
</style>
</head>
<body class="signedout">
<header>
  <div class="brand"><span>imoves</span> content <span class="muted small" id="ver">v0.2</span></div>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Find a subject, category, scheme, lesson or id" autocomplete="off" aria-label="Find content">
    <div class="results" id="qres" role="listbox"></div>
  </div>
  <div class="spacer"></div>
  <button class="btn" id="waitingBtn" title="Items with changes not yet published">Waiting <span class="pill pending" id="waitingCount" hidden>0</span></button>
  <span class="who" id="who"></span>
  <button class="btn quiet sm" id="signout" hidden>Sign out</button>
</header>
<div class="readonly" id="readonly" hidden>You are signed in but not on the staff list, so this is read-only.</div>
<main>
  <nav><div class="navtools"><select id="treeSort" title="Order"><option value="platform">Platform order</option><option value="name">A to Z</option><option value="changed">Recently changed</option></select><select id="treeFilter" title="Show"><option value="all">All</option><option value="pub">Published</option><option value="hid">Hidden</option></select></div><div class="tree" id="tree"><div class="hint">Loading…</div></div></nav>
  <section class="editor" id="editor">
    <div class="empty" style="padding-top:120px">
      <h2 style="font-weight:600;font-size:18px;margin-bottom:8px">Nothing open yet</h2>
      Open a subject on the left, or search above.
    </div>
  </section>
</main>
<div class="drawer" id="drawer"><div class="head"><h2 id="drawerTitle">Waiting to publish</h2><button class="btn quiet sm" id="drawerClose">Close</button></div><div class="items" id="drawerItems"></div></div>
<div class="modal" id="modal"></div>
<div class="modal" id="login"><div class="box narrow" style="padding:24px;display:block">
  <h2>Sign in</h2><p>Use your imoves email address and password. Only accounts on the staff list can edit.</p>
  <form id="loginform" novalidate>
    <div class="notice hidden" id="loginerror" role="alert" style="color:var(--danger);margin-bottom:10px"></div>
    <div class="field"><label for="le">Email address</label><input id="le" type="email" autocomplete="email" required style="width:100%"></div>
    <div class="field"><label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password" required style="width:100%"></div>
    <button class="btn primary" type="submit" id="loginbtn">Sign in</button>
  </form>
</div></div>
<div id="toast"></div>
<script src="config.js?v=0.2"></script>
<script src="cms.js?v=0.2"></script>
</body>
</html>
